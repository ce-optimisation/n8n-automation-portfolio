{% set fav_on = is_favourite(c.id) if is_favourite is defined else False %}<form class="fav" method="post" action="/clips/{{ c.id }}/favourite" hx-post="/clips/{{ c.id }}/favourite" hx-swap="outerHTML"><button class="btn{% if fav_on %} on{% endif %}" aria-pressed="{{ "true" if fav_on else "false" }}" title="Private selection only: does not publish, approve or share">{{ "★" if fav_on else "☆" }} Favourite</button></form>
