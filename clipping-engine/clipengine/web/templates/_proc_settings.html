<details><summary>Processing settings</summary>
  <div class="grid3">
    <label>Clips <input name="clips" type="number" min="1" max="20" placeholder="{{ s.clips_per_recording }}"></label>
    <label>Min seconds <input name="min_s" type="number" min="5" max="300" placeholder="{{ s.clip_min_seconds|int }}"></label>
    <label>Max seconds <input name="max_s" type="number" min="10" max="300" placeholder="{{ s.clip_max_seconds|int }}"></label>
    <label>Language <input name="language" placeholder="auto (e.g. en)" maxlength="5"></label>
  </div>
</details>
