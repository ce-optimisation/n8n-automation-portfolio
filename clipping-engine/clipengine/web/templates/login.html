{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="err">Incorrect password.</p>{% endif %}
  <form method="post" action="/login">
    <label>Dashboard password <input type="password" name="password" autofocus required></label>
    <button class="btn primary">Sign in</button>
  </form>
</section>
{% endblock %}
