{% extends "base.html" %}
{% block content %}
<h1>Recordings</h1>
<table class="jobs">
<thead><tr><th>#</th><th>Title</th><th>Length</th><th>Status</th><th>Clips</th></tr></thead>
<tbody>
{% for r in recordings %}
<tr><td>{{ r.id }}</td><td><a href="/recordings/{{ r.id }}">{{ r.title }}</a><br><small class="muted">{{ r.source_url or r.original_filename }}</small></td>
<td>{{ r.duration|mmss }}</td><td><span class="badge {{ r.status }}">{{ r.status }}</span></td><td>{{ r.nclips }}</td></tr>
{% else %}<tr><td colspan="5" class="muted">No recordings yet. <a href="/import">Import one</a>.</td></tr>{% endfor %}
</tbody></table>
{% endblock %}
